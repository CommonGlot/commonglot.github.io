<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scripts - CommonGlot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <section class="hero" style="padding:3rem 0;">
    <div class="container">
      <h1>Writing Systems</h1>
      <p>Explore the world's scripts and the GlotSuite tools that support them</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <!-- Filter Tabs -->
      <div class="filter-tabs" id="filter-tabs">
        <button class="filter-tab active" data-filter="all">All</button>
        <button class="filter-tab" data-filter="alphabet">Alphabets</button>
        <button class="filter-tab" data-filter="abugida">Abugidas</button>
        <button class="filter-tab" data-filter="abjad">Abjads</button>
        <button class="filter-tab" data-filter="syllabary">Syllabaries</button>
        <button class="filter-tab" data-filter="logographic">Logographic</button>
      </div>

      <!-- Search -->
      <div class="search-wrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" class="search-input" id="script-search" placeholder="Search scripts...">
      </div>

      <!-- Script Cards Grid -->
      <div class="card-grid" id="scripts-grid">
        <div class="loading">Loading scripts...</div>
      </div>
    </div>
  </section>

  <!-- Tools for Scripts -->
  <section class="section" style="background:var(--card-bg);">
    <div class="container">
      <div class="section-title">
        <h2>Script Technology</h2>
        <p>Tools and resources available for working with diverse writing systems</p>
      </div>
      <div class="card-grid" id="tools-grid">
        <div class="loading">Loading tools...</div>
      </div>
    </div>
  </section>

  <script src="../assets/js/main.js"></script>
  <script>
    let allScripts = [];

    const dirLabels = { ltr: 'Left to Right', rtl: 'Right to Left', ttb: 'Top to Bottom' };
    const dirArrows = { ltr: '→', rtl: '←', ttb: '↓' };

    function renderScripts(filter, search) {
      let filtered = allScripts;
      if (filter && filter !== 'all') {
        filtered = filtered.filter(s => s.type === filter);
      }
      if (search) {
        filtered = filtered.filter(s =>
          s.name.toLowerCase().includes(search) ||
          s.iso15924.toLowerCase().includes(search) ||
          s.type.toLowerCase().includes(search)
        );
      }

      const grid = document.getElementById('scripts-grid');
      if (filtered.length === 0) {
        grid.innerHTML = '<div class="loading">No scripts match your filter.</div>';
        return;
      }

      grid.innerHTML = filtered.map(s => `
        <div class="script-card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;">
            <div>
              <h3>${s.name}</h3>
              <code style="font-size:0.8rem;color:var(--text-secondary);">${s.iso15924}</code>
            </div>
            <span class="badge badge--brown">${s.type}</span>
          </div>
          <div class="script-sample" ${s.direction === 'rtl' ? 'dir="rtl"' : ''}>${s.sample_text}</div>
          <div class="script-meta">
            <span class="direction-indicator">${dirArrows[s.direction] || ''} ${dirLabels[s.direction] || s.direction}</span>
            <span class="badge badge--outline">${s.languages_count} language${s.languages_count !== 1 ? 's' : ''}</span>
            ${s.glotscript_supported ? '<span class="badge badge--orange">GlotScript</span>' : ''}
          </div>
          <div style="margin-top:0.75rem;">
            <div style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:4px;">Available tools:</div>
            <div class="card-links">
              ${s.tools.map(t => `<span class="card-link" style="cursor:default;">${t}</span>`).join('')}
            </div>
          </div>
          <div style="margin-top:0.75rem;font-size:0.8rem;color:var(--text-secondary);">
            Unicode: ${s.unicode_block}
          </div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const base = getBasePath();
      try {
        allScripts = await loadJSON(base + 'data/scripts.json');
        renderScripts('all', '');

        let currentFilter = 'all';
        setupFilterTabs('filter-tabs', filter => {
          currentFilter = filter;
          renderScripts(currentFilter, document.getElementById('script-search').value.toLowerCase().trim());
        });

        setupSearch('script-search', search => {
          renderScripts(currentFilter, search);
        });

        // Tools
        const tools = await loadJSON(base + 'data/tools.json');
        document.getElementById('tools-grid').innerHTML = tools.map(t => `
          <div class="card">
            <h3 style="margin-bottom:0.5rem;">${t.name}</h3>
            <span class="badge badge--outline" style="margin-bottom:0.75rem;display:inline-block;">${t.category.replace('_', ' ')}</span>
            <div class="card-description">${t.description}</div>
            <div style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:0.75rem;">
              ${t.supported_languages_count ? t.supported_languages_count + ' languages' : ''}
              ${t.supported_languages_count && t.supported_scripts_count ? ' &middot; ' : ''}
              ${t.supported_scripts_count ? t.supported_scripts_count + ' scripts' : ''}
            </div>
            <a href="${t.url}" class="card-link" target="_blank" rel="noopener">${linkIcon('code')} GitHub</a>
          </div>
        `).join('');
      } catch (e) {
        console.error('Failed to load scripts:', e);
      }
    });
  </script>
</body>
</html>
