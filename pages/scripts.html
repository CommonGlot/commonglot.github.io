<!doctype html>
<html lang="en">
<head>
  <title>Scripts directory — CommonGlot</title>
  <meta name="description" content="Every Unicode writing system: languages that use it, identification support and OCR benchmark results.">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6efe2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1813" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="../assets/img/glotsuite-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script>try{var t=localStorage.getItem('cg-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body data-page="scripts">
<main id="main">
  <section class="page-hero"><div class="container" id="scripts-hero"></div></section>
  <section class="section--tight"><div class="container"><div class="stats" id="scripts-stats"></div></div></section>
  <section class="section--tight"><div class="container">
    <div class="toolbar">
      <label class="search"><span class="visually-hidden">Search scripts</span><input class="input" id="script-q" type="search" placeholder="Search script name or ISO 15924 code…" autocomplete="off"></label>
      <label><span class="visually-hidden">Type</span><select class="select" id="f-type"></select></label>
      <label><span class="visually-hidden">Direction</span><select class="select" id="f-dir"></select></label>
      <label><span class="visually-hidden">OCR tier</span><select class="select" id="f-tier"></select></label>
    </div>
    <p class="result-count" id="script-count" aria-live="polite"></p>
    <div id="script-tabs"></div>
  </div></section>
</main>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/pages/scripts.js"></script>
</body>
</html>
