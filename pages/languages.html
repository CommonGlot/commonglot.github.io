<!doctype html>
<html lang="en">
<head>
  <title>Languages directory — CommonGlot</title>
  <meta name="description" content="A directory of the world's languages with a map, filters and a technology booklet for each one.">
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com 'sha256-NBrBS0QH+oPLLHYW9Dbq4b4noKdB8RLG3k0J1wMUdQ8='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://tile.openstreetmap.org https://cdnjs.cloudflare.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6efe2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1813" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="../assets/img/commonglot-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script>try{var t=localStorage.getItem('cg-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body data-page="languages">
<main id="main">
  <section class="page-hero"><div class="container" id="lang-hero"></div></section>
  <section class="section--tight"><div class="container">
    <div class="stats" id="lang-stats"></div>
  </div></section>
  <section class="section--tight"><div class="container">
    <div class="toolbar" id="lang-filters">
      <label class="search"><span class="visually-hidden">Search languages</span><input class="input" id="lang-q" type="search" placeholder="Search name, ISO 639-3 code or family…" autocomplete="off"></label>
      <label><span class="visually-hidden">Macroarea</span><select class="select" id="f-area"></select></label>
      <label><span class="visually-hidden">Endangerment</span><select class="select" id="f-end"></select></label>
      <label><span class="visually-hidden">Script</span><select class="select" id="f-script"></select></label>
    </div>
    <div class="toolbar chips" id="f-tech" role="group" aria-label="Coverage filters"></div>
    <p class="result-count" id="lang-count" aria-live="polite"></p>
    <div id="lang-tabs"></div>
  </div></section>
</main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/blocks.js"></script>
  <script src="../assets/js/pages/languages.js"></script>
</body>
</html>
