<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Languages - CommonGlot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    .leaflet-popup-content-wrapper { border-radius: 8px; }
    .leaflet-popup-content { margin: 12px 16px; font-family: Inter, sans-serif; font-size: 0.9rem; }
    .leaflet-popup-content h3 { font-size: 1rem; margin-bottom: 4px; }
    .leaflet-popup-content p { margin: 2px 0; color: #5a5a5a; font-size: 0.8rem; }
    .map-legend {
      background: var(--card-bg);
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 1rem;
      font-size: 0.85rem;
    }
    .map-legend-item { display: flex; align-items: center; gap: 6px; }
    .map-legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .lang-detail-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      margin-bottom: 2rem;
      display: none;
    }
    .lang-detail-panel.visible { display: block; }
    .lang-detail-panel h3 { margin-bottom: 0.5rem; }
    .lang-detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .lang-detail-item { font-size: 0.9rem; }
    .lang-detail-item strong { display: block; color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
  </style>
</head>
<body>
  <section class="hero" style="padding:3rem 0;">
    <div class="container">
      <h1>Languages</h1>
      <p>Explore languages covered by GlotSuite tools and corpora</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <!-- Legend -->
      <div class="map-legend">
        <span style="font-weight:600;">Color by macroarea:</span>
        <div class="map-legend-item"><span class="map-legend-dot" style="background:#e74c3c;"></span> Africa</div>
        <div class="map-legend-item"><span class="map-legend-dot" style="background:#3498db;"></span> Eurasia</div>
        <div class="map-legend-item"><span class="map-legend-dot" style="background:#2ecc71;"></span> Papunesia</div>
        <div class="map-legend-item"><span class="map-legend-dot" style="background:#f39c12;"></span> North America</div>
        <div class="map-legend-item"><span class="map-legend-dot" style="background:#9b59b6;"></span> South America</div>
      </div>

      <!-- Map -->
      <div class="map-container" id="lang-map"></div>

      <!-- Detail Panel -->
      <div class="lang-detail-panel" id="lang-detail">
        <h3 id="detail-name"></h3>
        <div class="lang-detail-grid" id="detail-grid"></div>
      </div>

      <!-- Search -->
      <div class="search-wrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" class="search-input" id="lang-search" placeholder="Search by name, ISO code, or family...">
      </div>

      <!-- Table -->
      <div class="table-wrap">
        <table id="lang-table">
          <thead>
            <tr>
              <th data-sort="name">Name <span class="sort-arrow">&#9650;</span></th>
              <th data-sort="iso">ISO 639-3 <span class="sort-arrow">&#9650;</span></th>
              <th data-sort="family">Family <span class="sort-arrow">&#9650;</span></th>
              <th data-sort="macroarea">Macroarea <span class="sort-arrow">&#9650;</span></th>
              <th data-sort="scripts">Scripts <span class="sort-arrow">&#9650;</span></th>
              <th data-sort="speakers" data-type="number">Speakers <span class="sort-arrow">&#9650;</span></th>
              <th>Coverage</th>
            </tr>
          </thead>
          <tbody id="lang-tbody">
            <tr><td colspan="7" class="loading">Loading languages...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="../assets/js/main.js"></script>
  <script>
    const macroareaColors = {
      'Africa': '#e74c3c',
      'Eurasia': '#3498db',
      'Papunesia': '#2ecc71',
      'North America': '#f39c12',
      'South America': '#9b59b6',
      'Australia': '#1abc9c'
    };

    let allLanguages = [];

    function showDetail(lang) {
      const panel = document.getElementById('lang-detail');
      document.getElementById('detail-name').textContent = lang.name;
      document.getElementById('detail-grid').innerHTML = `
        <div class="lang-detail-item"><strong>ISO 639-3</strong>${lang.iso639_3}</div>
        <div class="lang-detail-item"><strong>Family</strong>${lang.family}</div>
        <div class="lang-detail-item"><strong>Macroarea</strong>${lang.macroarea}</div>
        <div class="lang-detail-item"><strong>Scripts</strong>${lang.scripts.join(', ')}</div>
        <div class="lang-detail-item"><strong>Speakers</strong>${formatNumber(lang.speakers)}</div>
        <div class="lang-detail-item"><strong>Endangerment</strong>${lang.endangerment}</div>
        <div class="lang-detail-item"><strong>GlotLID</strong>${lang.glotlidSupported ? 'Supported' : 'Not supported'}</div>
        <div class="lang-detail-item"><strong>GlotCC</strong>${lang.glotccCoverage ? 'Covered' : 'Not covered'}</div>
        <div class="lang-detail-item"><strong>GlotWeb</strong>${lang.glotwebIndexed ? 'Indexed' : 'Not indexed'}</div>
      `;
      panel.classList.add('visible');
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function renderTable(search) {
      let filtered = allLanguages;
      if (search) {
        filtered = filtered.filter(l =>
          l.name.toLowerCase().includes(search) ||
          l.iso639_3.toLowerCase().includes(search) ||
          l.family.toLowerCase().includes(search) ||
          l.macroarea.toLowerCase().includes(search)
        );
      }

      const tbody = document.getElementById('lang-tbody');
      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="loading">No languages match your search.</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(l => `
        <tr style="cursor:pointer;" onclick='showDetail(${JSON.stringify(l).replace(/'/g, "\\'")})'>
          <td><strong>${l.name}</strong></td>
          <td><code>${l.iso639_3}</code></td>
          <td>${l.family}</td>
          <td>${l.macroarea}</td>
          <td>${l.scripts.join(', ')}</td>
          <td>${formatNumber(l.speakers)}</td>
          <td>
            <div class="coverage-icons">
              <span class="coverage-icon ${l.glotlidSupported ? 'active' : ''}" title="GlotLID">LID</span>
              <span class="coverage-icon ${l.glotccCoverage ? 'active' : ''}" title="GlotCC">CC</span>
              <span class="coverage-icon ${l.glotwebIndexed ? 'active' : ''}" title="GlotWeb">Web</span>
            </div>
          </td>
        </tr>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const base = getBasePath();
      try {
        allLanguages = await loadJSON(base + 'data/languages.json');

        // Leaflet map
        const map = L.map('lang-map').setView([20, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors',
          maxZoom: 8
        }).addTo(map);

        allLanguages.forEach(lang => {
          const color = macroareaColors[lang.macroarea] || '#888';
          const marker = L.circleMarker([lang.latitude, lang.longitude], {
            radius: 7,
            fillColor: color,
            color: '#fff',
            weight: 1.5,
            fillOpacity: 0.85
          }).addTo(map);

          marker.bindPopup(`
            <h3>${lang.name}</h3>
            <p><strong>${lang.iso639_3}</strong> &middot; ${lang.family}</p>
            <p>${formatNumber(lang.speakers)} speakers &middot; ${lang.endangerment}</p>
            <p>Scripts: ${lang.scripts.join(', ')}</p>
          `);

          marker.on('click', () => showDetail(lang));
        });

        // Table
        renderTable('');
        setupSearch('lang-search', search => renderTable(search));
        setupTableSort('lang-table');
      } catch (e) {
        console.error('Failed to load languages:', e);
      }
    });
  </script>
</body>
</html>
