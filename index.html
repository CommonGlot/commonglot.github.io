<!doctype html>
<html lang="en" data-base="./">
<head>
  <title>CommonGlot — open language technology for every language</title>
  <meta name="description" content="Open tools, corpora, models and benchmarks for under-served languages, and a directory of what technology exists for every language and script.">
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com 'sha256-NBrBS0QH+oPLLHYW9Dbq4b4noKdB8RLG3k0J1wMUdQ8='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://tile.openstreetmap.org https://cdnjs.cloudflare.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6efe2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1813" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/img/commonglot-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>try{var t=localStorage.getItem('cg-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body data-page="home">
<main id="main">
  <section class="hero"><div class="container hero-grid">
    <div id="hero-text"><div class="loading">Loading</div></div>
    <div class="hero-art" id="hero-art" aria-hidden="true"></div>
  </div></section>
  <section class="section--tight"><div class="container">
    <h2 class="visually-hidden" id="numbers-title"></h2>
    <div class="stats" id="home-stats"></div>
  </div></section>
  <section class="section"><div class="container" id="home-mission"></div></section>
  <section class="section section--band"><div class="container">
    <div class="section-head" id="deliver-head"></div>
    <div id="home-deliverables"></div>
  </div></section>
  <section class="section"><div class="container">
    <div class="section-head" id="directory-head"></div>
    <div class="grid grid-2" style="align-items:start">
      <div><div class="map" id="home-map" role="region" aria-label="Map of languages"></div><div class="legend" id="home-legend"></div></div>
      <div id="directory-examples"></div>
    </div>
  </div></section>
  <section class="section section--band"><div class="container">
    <div class="section-head" id="projects-head"></div>
    <div class="grid grid-auto" id="home-projects"></div>
  </div></section>
  <section class="section"><div class="container" id="home-glotsuite"></div></section>
  <section class="section--tight"><div class="container" id="home-cta"></div></section>
</main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/blocks.js"></script>
  <script src="assets/js/pages/home.js"></script>
</body>
</html>
